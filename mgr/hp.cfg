server:
  host: "0.0.0.0"
  port: 3000

  base_url: "https://headscale.bangasser.dev"

  # Must be exactly 32 characters. Generate one with:
  #   openssl rand -hex 16
  # and paste the output below.
  cookie_secret: "REPLACE_WITH_32_CHAR_SECRET_HERE"

  # true because Traefik terminates HTTPS in front of this
  cookie_secure: true

  # How long a login session lasts, in seconds. Default upstream is 1 day
  # (86400); bumped to 30 days here since this is single-admin infra and
  # there's no OIDC yet to make re-login painless.
  cookie_max_age: 2592000

  data_path: "/var/lib/headplane"

headscale:
  # Internal address — container-to-container over the `proxy` network,
  # not the public https:// URL.
  url: "http://headscale:8080"

  config_path: "/etc/headscale/config.yaml"

  # Mounted read-only for now (see compose file), so this is left false:
  # Headplane will show Headscale's config but can't act on strict-mode
  # validation errors it can't fix anyway. Flip to true once you've
  # confirmed everything reads cleanly in the UI.
  config_strict: false
