version: "3.8"

services:
  whoami:
    image: docker.io/traefik/whoami
    container_name: whoami-app
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`whoami.bangasser.dev`)"
      - "traefik.http.routers.whoami.entrypoints=websecure"
      - "traefik.http.routers.whoami.tls=true"
      - "traefik.http.routers.whoami.tls.certresolver=le"
      - "traefik.http.middlewares.pass-cert.passtlsclientcert.pem=true"
      - "traefik.http.routers.whoami.middlewares=pass-cert"
      - "traefik.http.middlewares.pass-cert.passtlsclientcert.info.subject.commonname=true"
      - "traefik.http.routers.whoami.tls.options=require-mtls@file"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.bangasser.dev`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=le"
      - "traefik.http.routers.dashboard.tls.options=require-mtls@file"

  step-ca-init:
    image: docker.io/smallstep/step-ca
    user: "0:0"
    environment:
      CA_PASSWORD: ${REMOTE_DB_PASSWORD}
      DB_HOST: "na-bangasser-db-0-bangasser-db.g.aivencloud.com"
    volumes:
      - ca:/home/step:Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /home/step/config/ca.json ]; then
          echo "Initializing CA from cold start..."
          apk add -q jq
          
          echo -n "$$CA_PASSWORD" > /tmp/pass.txt
          
          step ca init --name='Bangasser CA' \
            --dns='ca.bangasser.dev,localhost,ca' \
            --address=':9000' \
            --provisioner='admin@bangasser.dev' \
            --password-file=/tmp/pass.txt \
            --provisioner-password-file=/tmp/pass.txt \
            --no-db

          step ca provisioner add acme --type ACME --ca-config /home/step/config/ca.json

          mv /tmp/pass.txt /home/step/secrets/password

          jq --arg db_host "$$DB_HOST" '.db = {
            "type": "postgresql",
            "database": "stepca",
            "dataSource": ("host=" + $$db_host + " port=27936 user=stepca_dbuser sslmode=require")
          }' /home/step/config/ca.json > /tmp/ca.json
          
          cat /tmp/ca.json > /home/step/config/ca.json
          
          chown -R 1000:1000 /home/step
          
          rm /tmp/ca.json
          echo "Initialization complete."
        else
          echo "CA already initialized. Skipping cold start."
        fi

  ca:
    image: docker.io/smallstep/step-ca
    environment:
      PGPASSWORD: ${STEPCA_DB_PASSWORD}
    depends_on:
      step-ca-init:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - ca:/home/step:Z
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.tcp.routers.step-router.rule=HostSNI(`ca.bangasser.dev`)"
      - "traefik.tcp.routers.step-router.entrypoints=websecure"
      - "traefik.tcp.routers.step-router.tls.passthrough=true"
      - "traefik.tcp.routers.step-router.service=step-svc"
      - "traefik.tcp.services.step-svc.loadbalancer.server.port=9000"

  headscale:
    image: headscale/headscale:stable
    container_name: headscale
    volumes:
      - ./hs.cfg:/etc/headscale
      - ./container-data/data:/var/lib/headscale
    command: serve
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.headscale.rule=Host(`headscale.bangasser.dev`)"
      - "traefik.http.routers.headscale.entrypoints=websecure"
      - "traefik.http.routers.headscale.tls=true"
      - "traefik.http.routers.headscale.tls.certresolver=le"
      - "traefik.http.routers.headscale.middlewares=headscale-cors"
      - "traefik.http.middlewares.headscale-cors.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.headscale-cors.headers.accesscontrolallowmethods=GET,POST,PUT"
      - "traefik.http.middlewares.headscale-cors.headers.accesscontrolalloworiginlist=https://headscale.bangasser.dev"
      - "traefik.http.middlewares.headscale-cors.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.headscale-cors.headers.addvaryheader=true"
      - "traefik.http.routers.headscale-root.rule=Host(`headscale.bangasser.dev`) && Path(`/`)"
      - "traefik.http.routers.headscale-root.service=headscale-root-redirect"
      - "traefik.http.routers.headscale-root.middlewares=headscale-redirect"
      - "traefik.http.middlewares.headscale-redirect.addprefix.prefix=/admin"

  headplane:
    image: ghcr.io/tale/headplane:latest
    container_name: headplane
    restart: unless-stopped
    depends_on:
      - headscale
    volumes:
      - ./headplane-config/config.yaml:/etc/headplane/config.yaml:Z
      - ./headplane-data:/var/lib/headplane:Z
      - ./container-config:/etc/headscale:ro,Z
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.headplane.rule=Host(`headscale.bangasser.dev`) && PathPrefix(`/admin`)"
      - "traefik.http.routers.headplane.entrypoints=websecure"
      - "traefik.http.routers.headplane.tls=true"
      - "traefik.http.routers.headplane.tls.certresolver=le"
      - "traefik.http.routers.headplane.service=headplane-svc"
      - "traefik.http.services.headplane-svc.loadbalancer.server.port=3000"

volumes:
  ca: {}

networks:
  proxy:
    external: true
    name: proxy
