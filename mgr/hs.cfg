server_url: https://headscale.bangasser.dev

listen_addr: 0.0.0.0:8080
metrics_listen_addr: 0.0.0.0:9090

noise:
  # Auto-generated on first run and persisted in your existing
  # ./container-data/data volume.
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

derp:
  server:
    enabled: false
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  paths: []
  auto_update_enabled: true
  update_frequency: 3h

disable_check_updates: false

node:
  expiry: 0
  ephemeral:
    inactivity_timeout: 30m
  routes:
    ha:
      probe_interval: 10s
      probe_timeout: 5s

database:
  type: postgres
  postgres:
    host: na-bangasser-db-0-bangasser-db.g.aivencloud.com
    port: 27936
    name: headscale             # The name of the database you created
    user: headscale_dbuser      # The postgres user you created
    password: "YOUR_PASSWORD"   
    ssl: require                # Required for Aiven

# TLS is terminated by Traefik in front of this container, so Headscale's
# own ACME/TLS settings stay empty.
acme_email: ""
tls_letsencrypt_hostname: ""
tls_cert_path: ""
tls_key_path: ""

log:
  level: info
  format: text

policy:
  mode: file
  path: ""

dns:
  magic_dns: true
  base_domain: ts.bangasser.dev
  override_local_dns: true
  nameservers:
    global:
      - 1.1.1.1
      - 1.0.0.1
    split: {}
  search_domains: []
  extra_records: []

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

logtail:
  enabled: true

taildrop:
  enabled: true

auto_update:
  enabled: true
